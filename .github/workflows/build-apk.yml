name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & Build Frontend
        run: |
          npm install
          npx vite build

      - name: Add and Sync Android
        run: |
          npx cap add android || true
          npx @capacitor/assets generate --android || true
          npx cap sync android

      - name: Set Custom App Icons
        run: |
          # Copy icon to all standard density folders (avoiding anydpi xml duplicate collision)
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp public/icon.png "android/app/src/main/res/mipmap-$density/ic_launcher.png" || true
            cp public/icon.png "android/app/src/main/res/mipmap-$density/ic_launcher_round.png" || true
            cp public/icon.png "android/app/src/main/res/mipmap-$density/ic_launcher_foreground.png" || true
            
            mkdir -p "android/app/src/main/res/drawable-$density"
            cp public/logo.png "android/app/src/main/res/drawable-$density/splash.png" || true
          done

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

