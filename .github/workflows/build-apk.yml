name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & Build Frontend
        run: |
          npm install
          npx vite build

      - name: Add and Sync Android
        run: |
          npx cap add android || true
          npx @capacitor/assets generate --android || true
          npx cap sync android

      - name: Set Custom App Icons
        run: |
          # Copy high resolution app icon to all android mipmap density folders
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp public/icon.png "$dir/ic_launcher.png" || true
              cp public/icon.png "$dir/ic_launcher_round.png" || true
              cp public/icon.png "$dir/ic_launcher_foreground.png" || true
            fi
          done
          # Copy splash
          for dir in android/app/src/main/res/drawable*; do
            if [ -d "$dir" ]; then
              cp public/logo.png "$dir/splash.png" || true
            fi
          done

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

